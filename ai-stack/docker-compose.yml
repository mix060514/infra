services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    tty: true
    ports:
      - "11434:11434"
    volumes:
      # 1. 內部資料庫
      - ./data/ollama:/root/.ollama
      
      # 2. 模型暫存區
      - ./models/gguf:/models
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_KEEP_ALIVE=24h  # (選用) 讓模型載入後保持 24 小時不卸載，反應更快
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - ./models/gguf:/models
    environment:
      - LLAMA_ARG_MODEL=/models/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      # - LLAMA_ARG_MODEL=/models/Qwen3-14B-Q4_K_M.gguf
      - LLAMA_ARG_CTX_SIZE=32768
      # - LLAMA_ARG_CTX_SIZE=262144
      - LLAMA_ARG_N_GPU_LAYERS=99
      # Qwen3 recommended sampling parameters
      - LLAMA_ARG_TEMP=0.7
      - LLAMA_ARG_TOP_P=0.8
      - LLAMA_ARG_TOP_K=20
      - LLAMA_ARG_MIN_P=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  llama-cpp-vl:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-vl
    restart: always
    ports:
      - "8082:8080"
    volumes:
      - ./models/gguf:/models
    environment:
      - LLAMA_ARG_MODEL=/models/Qwen3VL-4B-Instruct-Q4_K_M.gguf
      - LLAMA_ARG_MMPROJ=/models/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf
      - LLAMA_ARG_CTX_SIZE=32768
      - LLAMA_ARG_N_GPU_LAYERS=99
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

