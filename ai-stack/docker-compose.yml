services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    tty: true
    ports:
      - "11434:11434"
    volumes:
      # 1. 內部資料庫
      - ./data/ollama:/root/.ollama
      
      # 2. 模型暫存區
      - ./models/gguf:/models
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_KEEP_ALIVE=24h  # (選用) 讓模型載入後保持 24 小時不卸載，反應更快
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  sglang:
    image: lmsysorg/sglang:latest
    container_name: sglang
    restart: always
    ports:
      - "30000:30000"
    volumes:
      - ./models/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command: >
      python3 -m sglang.launch_server
      --model-path Qwen/Qwen3-14B-AWQ
      --host 0.0.0.0
      --port 30000
      --context-length 16384
      --mem-fraction-static 0.65
      --quantization awq_marlin
      --enable-torch-compile
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 3. WebUI 資料
      - ./data/open-webui:/app/backend/data
