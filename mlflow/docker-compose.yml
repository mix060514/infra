services:
  mlflow:
    container_name: infra-mlflow
    build: .
    restart: always
    env_file:
      - .env
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${MLFLOW_DB}
      --default-artifact-root /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts 0.0.0.0,192.168.1.102,192.168.1.102:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
      --cors-allowed-origins '*'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
